{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block public_content %}
<div class="auth-page"><a class="brand" href="/"><span class="brand-mark">P</span><span>playline<span class="brand-dot">.</span></span></a><div class="auth-card"><div class="eyebrow">JOIN THE ARCADE</div><h1>Create your account.</h1><p class="muted">A username, an email, and you're in.</p><form method="post"><label>Username</label><input name="username" minlength="3" required placeholder="Choose a username"><label>Email address</label><input type="email" name="email" required placeholder="you@example.com"><label>Password</label><input type="password" name="password" minlength="6" required placeholder="At least 6 characters"><button class="button button-glow full-width" type="submit">Create account <span>→</span></button></form><p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div></div>
{% endblock %}
